  manual:{n:'Manual de uso',i:'📖',w:640,h:580,r(b){

<p>Ir a: <a href="#" data-sec=0>🚀 Primeros pasos</a> · <a href="#" data-sec=1>🪟 Ventanas</a> · <a href="#" data-sec=2>⌨️ Atajos</a> · <a href="#" data-sec=3>🧩 Aplicaciones</a> · <a href="#" data-sec=4>🎵 Mi Música</a> · <a href="#" data-sec=5>⛅ Clima y volumen</a> · <a href="#" data-sec=6>💡 Consejos</a></p><h3>🚀 Primeros pasos</h3><ul><li>Abrí las aplicaciones con la <b>tecla Windows ⊞</b> (o <b>Alt+A</b>), o tocando el botón ⊞ de la barra de abajo.</li><li>En el escritorio, hacé doble clic (o doble toque) en un ícono para abrirlo. Podés arrastrar los íconos de lugar.</li></ul>
<h3>🪟 Ventanas</h3><ul><li>Se abren chicas. <b>Doble clic o doble toque en la barra del título</b> las pone en pantalla grande; otra vez, vuelven.</li><li>Arrastrá el título para moverla y la esquina de abajo a la derecha para cambiarle el tamaño.</li><li>Botones: — esconde, ▢ agranda, ✕ cierra. Las ventanas abiertas aparecen en la barra de abajo.</li></ul>
<h3>⌨️ Atajos de teclado</h3><ul><li><b>⊞ o Alt+A</b>: aplicaciones · <b>Alt+S</b>: buscar · <b>Alt+C</b>: clima · <b>Alt+K</b>: teclado en pantalla</li><li><b>Alt+J</b>: cambiar de ventana · <b>Alt+W</b>: cerrar · <b>Alt+Enter</b>: agrandar · <b>Alt+M</b>: esconder</li><li><b>Alt+flechas</b>: mover la ventana · <b>Alt+Shift+flechas</b>: cambiar tamaño</li><li><b>Esc</b>: cierra menús · En el menú de aplicaciones: flechas y Enter.</li><li>Calculadora: andan los números y el teclado numérico. Piano: A W S E D F T G Y H U J K O L P Ñ.</li></ul>
<h3>🧩 Aplicaciones</h3><p style="margin:0 0 6px">Tocá una para abrirla:</p><div id=mg style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div><ul><li>🌐 <b>Navegador</b>: escribí una dirección o buscá. Si una página queda en blanco, probá 🛡️ Proxy o ↗. 📄➜Word pasa el texto de la página a Word.</li><li>🎮 <b>Tienda de juegos</b>: muchos juegos; podés agregar los tuyos con una dirección.</li><li>📻 <b>Radios</b> y 📺 <b>Canales</b> argentinos, con buscador.</li><li>📰 <b>Noticias</b> de varios diarios · 🤖 <b>IA</b>: Claude y Gemini (necesitás tu propia clave en 🔑).</li><li>🎵 <b>Mi Música</b>: tu lista de canciones en español e inglés, con carátulas.</li><li>🎹 <b>Piano</b> · 🎨 <b>Paint</b> · 📅 <b>Calendario</b> (con notas que se repiten cada año) · 📁 <b>Explorador de archivos</b></li><li>📝 <b>Bloc de notas</b>, <b>Word</b>, <b>Excel</b>, 🧮 <b>Calculadora</b> y ⚙️ <b>Configuración</b>.</li></ul>
<h3>🎵 Mi Música</h3><ul><li>Abrila desde el escritorio o el menú. Se ven tus canciones con su carátula; tocá una para escucharla y seguí con ⏮ ⏭ o 🔀 (aleatorio).</li><li>Las pestañas <b>Español</b> e <b>Inglés</b> separan la música por idioma; <b>Todas</b> muestra todo y arriba podés buscar por nombre.</li><li>Con el teclado: <b>Espacio</b> pausa o reproduce, <b>N</b> siguiente, <b>P</b> anterior.</li></ul><h3>⛅ Clima, volumen y pantalla completa</h3><ul><li>El <b>clima</b> está abajo a la izquierda: tocalo para ver el pronóstico y cambiar de ciudad.</li><li>Abajo a la derecha están el <b>volumen</b> y el botón de <b>pantalla completa</b> ⛶.</li></ul>
